[project]
name = "data-mining-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
]

[project.scripts]
fetch-speeches = "data_mining_project.fetch_speeches:main"
fetch-representatives = "data_mining_project.fetch_representatives:main"
merge-speeches = "data_mining_project.merge_dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_mining_project"]
